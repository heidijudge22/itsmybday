<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Simple Form Test</h1>
    <p>This is a simplified version of your RSVP form to test if Formspree is working correctly.</p>
    
    <!-- Basic form with minimal styling -->
    <form action="https://formspree.io/f/xwpovgye" method="POST">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="3"></textarea>
        </div>
        
        <input type="hidden" name="_next" value="https://heidijudge22.github.io/itsmybday/thanks.html">
        <button type="submit">Submit Test</button>
    </form>
    
    <p><a href="index.html">Back to main page</a></p>
</body>
</html>
