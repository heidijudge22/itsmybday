<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <!-- Circular sticker with cyan border -->
  <defs>
    <clipPath id="circleClip">
      <circle cx="75" cy="75" r="70" />
    </clipPath>
  </defs>
  
  <!-- Image placeholder - we'll use a colored circle with text -->
  <circle cx="75" cy="75" r="70" fill="#1a0033" clip-path="url(#circleClip)" />
  
  <!-- Text representing person -->
  <text x="75" y="75" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Dedrick</text>
  <text x="75" y="95" font-family="Arial" font-size="12" fill="#32CD32" text-anchor="middle" dominant-baseline="middle">Sipping!</text>
  
  <!-- Yellow drink with straw -->
  <path d="M60,55 L90,55 L82,85 L68,85 Z" fill="none" stroke="#FFFFFF" stroke-width="2" />
  <path d="M75,85 L75,100" stroke="#FFFFFF" stroke-width="2" />
  <path d="M65,100 L85,100" stroke="#FFFFFF" stroke-width="2" />
  <path d="M75,55 C75,55 65,45 60,35" stroke="#FFFFFF" stroke-width="2" fill="none" />
  <circle cx="75" cy="70" r="10" fill="#FFFF00" opacity="0.7" />
  
  <!-- Border -->
  <circle cx="75" cy="75" r="70" fill="none" stroke="#00FFFF" stroke-width="4" />
</svg>